<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrador de Catálogo</title>
</head>
<body>
    <h2>Formulario de Libros</h2>
    <form id="form-libro">
        <label>Título:</label>
        <input type="text" id="titulo-libro" required>
        
        <label>Categoría:</label>
        <select id="categoria-libro">
            <!-- Cargado dinámicamente -->
        </select>
        
        <label>Ubicación (Mapa/Imagen):</label>
        <input type="file" id="ubicacion-img" accept="image/*">
        
        <button type="submit">Guardar Libro</button>
    </form>
    
    <hr>
    
    <div id="gestion-categorias">
        <h3>Gestionar Categorías</h3>
        <input type="text" id="nueva-categoria" placeholder="Nombre de nueva categoría">
        <button id="btn-agregar-categoria">Agregar Categoría</button>
        <ul id="lista-categorias">
            <!-- Cargado dinámicamente -->
        </ul>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
