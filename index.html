<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Editorial</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <header>
        <h1>Catálogo de Libros</h1>
        <input type="text" id="buscador-libros" placeholder="Buscar libro por título o autor...">
    </header>
    
    <main>
        <div id="grilla-libros">
            <!-- La grilla de libros se renderiza aquí -->
        </div>

        <div id="detalle-libro" style="display: none;">
            <button id="btn-volver">Volver al catálogo</button>
            <div id="contenido-detalle"></div>
        </div>
    </main>

    <script src="js/catalogo.js"></script>
</body>
</html>
